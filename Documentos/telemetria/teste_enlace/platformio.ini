; ============================================================
;  TESTE DO ENLACE: SX1276 (CanSat) -> SX1276 + RYLR998 (base)
;
;  Projeto separado: NAO mexe nos firmwares de ../src (foguete e base).
;  Usa o MESMO formato de pacote do CanSat real (../lib/Telemetria/Protocolo.h)
;  e parametros de radio compativeis com o RYLR998 (lib/Enlace/ConfigEnlace.h).
;  Documento: ../docs/arquitetura_enlace_reyax.md
;
;    pio run -e cansat_sim -t upload          Codigo 1 na placa do CanSat (ESP32-C3 SuperMini)
;    pio run -e cansat_sim_devkit -t upload   Codigo 1 numa ESP32 DevKit + SX1276
;    pio run -e base_dupla -t upload          Codigo 2: base com SX1276 + RYLR998 + dashboard
;    pio run -e bancada -t upload             farejador/gerador da secao 8 do documento (opcional)
;    pio device monitor -e <ambiente>
;
;  Payload em binario (so depois do teste T3 do documento): acrescente
;  -DTLM_CODIFICACAO=0 nos build_flags do Codigo 1. A base aceita os dois.
; ============================================================

[platformio]
default_envs = cansat_sim, base_dupla

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
; ../lib/Telemetria traz o Protocolo.h do CanSat real (formato do pacote).
; NAO inclua o ConfigLoRa.h de la: os parametros do teste ficam em ConfigEnlace.h.
lib_extra_dirs = ../lib
lib_deps =
    jgromes/RadioLib@^7.1.2

; ---------------- Codigo 1: CanSat simulado ----------------
[env:cansat_sim]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_src_filter = +<cansat_sim/>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:cansat_sim_devkit]
board = esp32dev
build_src_filter = +<cansat_sim/>
build_flags =
    -DPLACA_DEVKIT=1

; ---------------- Codigo 2: base com dois receptores ----------------
; Rede Wi-Fi "EstacaoBase-Teste", dashboard em http://192.168.4.1
; O script gera src/base_dupla/dashboard_html.h a partir de web/dashboard.html.
[env:base_dupla]
board = esp32doit-devkit-v1
board_build.partitions = no_ota.csv
build_src_filter = +<base_dupla/>
extra_scripts = pre:ferramentas/gerar_dashboard.py
monitor_filters = esp32_exception_decoder

; ---------------- Ferramenta de bancada (secao 8 do documento) ----------------
[env:bancada]
board = esp32doit-devkit-v1
build_src_filter = +<bancada/>
monitor_filters = esp32_exception_decoder
