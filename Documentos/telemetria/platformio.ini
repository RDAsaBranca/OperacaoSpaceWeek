; ============================================================
;  Telemetria LoRa SX1276 - foguete (ESP32-C3 SuperMini) + base (ESP32)
;
;  Um unico projeto PlatformIO gera os DOIS firmwares:
;    pio run -e foguete -t upload      -> grava o foguete (testes, com diagnostico na USB)
;    pio run -e foguete_voo -t upload  -> grava o foguete para o lancamento (sem diagnostico)
;    pio run -e foguete_devkit -t upload -> foguete numa ESP32 DevKit V1 (so bancada)
;    pio run -e base    -t upload      -> grava a estacao base com SX1276
;    pio run -e base_reyax -t upload   -> grava a estacao base com REYAX RYLR998
;    pio run -e base_heltec -t upload  -> grava a estacao base numa Heltec WiFi LoRa 32 V2
;    pio device monitor -e foguete     -> abre o monitor serial do foguete
;    pio device monitor -e base        -> abre o monitor serial da base
;
;  O codigo comum aos dois (formato do pacote e parametros do radio)
;  fica em lib/Telemetria e e compilado automaticamente nos dois.
; ============================================================

[platformio]
default_envs = foguete, foguete_voo, foguete_devkit, base, base_reyax, base_heltec

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.2

; ---------------- Foguete: ESP32-C3 SuperMini ----------------
; Opcoes comuns as duas versoes do foguete (testes e voo).
; IMU_MODO_ALTO_G=0 -> BNO055 em fusao (orientacao, acelerometro ate 4 g)
; IMU_MODO_ALTO_G=1 -> BNO055 cru (sem orientacao, acelerometro ate 16 g)
; O pacote vai no quadro do RYLR998 (lib/Telemetria/QuadroReyax.h) em Base64.
; So depois do teste T3 (docs/arquitetura_enlace_reyax.md): -DTLM_CODIFICACAO=0
; manda em binario (69 bytes em vez de 93). A base e a base_dupla aceitam os dois.
[foguete_comum]
build_flags =
    -DIMU_MODO_ALTO_G=0

; USB nativa da C3: o Serial (diagnostico e comandos) vai pela USB-CDC.
; SO na C3. Numa ESP32 classica estas flags fazem o Serial deixar de existir.
[usb_c3]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Testes de bancada na placa de voo (C3 SuperMini, PCB V1.7):
; DIAGNOSTICO_USB=1 imprime o diagnostico de cada componente na USB,
; uma vez por segundo.
[env:foguete]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_src_filter = +<foguete/>
build_flags =
    ${foguete_comum.build_flags}
    ${usb_c3.build_flags}
    -DDIAGNOSTICO_USB=1
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit BNO055@^1.6.3
    mikalhart/TinyGPSPlus@^1.1.0

; Lancamento: mesmo firmware, com DIAGNOSTICO_USB=0. As mensagens de
; diagnostico nem sao compiladas. Os comandos "info" e "ajuda" continuam.
[env:foguete_voo]
extends = env:foguete
build_flags =
    ${foguete_comum.build_flags}
    ${usb_c3.build_flags}
    -DDIAGNOSTICO_USB=0

; Bancada SEM a placa de voo: o mesmo firmware do foguete numa ESP32 DevKit V1,
; com os sensores e o SX1276 ligados nos pinos da DevKit (PLACA_DEVKIT=1, ver
; src/foguete/pinos.h). Sem as flags da USB da C3: o Serial vai pelo
; conversor USB-serial da DevKit. Nunca grave este ambiente na C3.
[env:foguete_devkit]
extends = env:foguete
board = esp32doit-devkit-v1
build_flags =
    ${foguete_comum.build_flags}
    -DPLACA_DEVKIT=1
    -DDIAGNOSTICO_USB=1
monitor_filters = esp32_exception_decoder

; ---------------- Estacao base: ESP32 DevKit ----------------
; Cria a rede Wi-Fi "EstacaoBase-Foguete" e serve o dashboard em
; http://192.168.4.1 (nome e senha em src/base/config_base.h).
; no_ota.csv: 2 MB para o programa e ~1,9 MB para as gravacoes.
; O script gera src/base/dashboard_html.h a partir de web/dashboard.html.
; SIMULAR_FOGUETE=1 gera um voo ficticio (testa o dashboard sem foguete).
; A base tem UM receptor (RECEPTOR_BASE, ver src/base/config_base.h):
;   [env:base]        SX1276 no SPI: tira o cabecalho Reyax no firmware
;   [env:base_reyax]  REYAX RYLR998 na UART2: o modulo tira o cabecalho
;   [env:base_heltec] SX1276 da placa Heltec WiFi LoRa 32 V2 (outro board)
; Todos aceitam o quadro em Base64 ou binario e saem no mesmo formato.
[env:base]
board = esp32doit-devkit-v1
board_build.partitions = no_ota.csv
build_src_filter = +<base/>
extra_scripts = pre:ferramentas/gerar_dashboard.py
build_flags =
    -DSIMULAR_FOGUETE=0
    -DRECEPTOR_BASE=RECEPTOR_SX1276
monitor_filters = esp32_exception_decoder

[env:base_reyax]
extends = env:base
build_flags =
    -DSIMULAR_FOGUETE=0
    -DRECEPTOR_BASE=RECEPTOR_RYLR998

; Heltec WiFi LoRa 32 V2 (placa branca com OLED e SX1276 soldado): mesmo
; firmware da [env:base], so com os pinos da placa. O board define
; ARDUINO_HELTEC_WIFI_LORA_32_V2, que escolhe o mapa em src/base/pinos.h.
; So a versao 868/915 MHz (SX1276) serve: a de 433 MHz (SX1278) nao chega
; aos 915,2 MHz do enlace.
; A placa original tem 8 MB de flash, mas o no_ota.csv so usa 4 MB. Declarar
; 4 MB faz o mesmo arquivo rodar tambem nos clones de 4 MB (com 8 MB no
; cabecalho, um chip de 4 MB trava no boot).
[env:base_heltec]
extends = env:base
board = heltec_wifi_lora_32_V2
board_upload.flash_size = 4MB
build_flags =
    -DSIMULAR_FOGUETE=0
    -DRECEPTOR_BASE=RECEPTOR_SX1276
